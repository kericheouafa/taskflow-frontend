<main class="page">

  <h1>Nouvelle tâche</h1>
  <p class="sous-titre">Renseignez l'essentiel, vous pourrez la modifier plus tard.</p>

  <div class="carte">
    <form>

      <mat-form-field appearance="outline">
        <mat-label>Titre</mat-label>
        <!-- name est obligatoire dans un <form> pour que ngModel fonctionne -->
        <input matInput placeholder="Ex. Préparer la démo" name="titre" autocomplete="off" [(ngModel)]="titre">
        @if (erreurs()['titre']) {
          <small class="erreur">{{ erreurs()['titre'] }}</small>
        }
      </mat-form-field>

      <div class="ligne">

      <mat-form-field appearance="outline" hideRequiredMarker>
  <mat-label>Priorité</mat-label>
          <select matNativeControl name="priorite" [(ngModel)]="priorite" required>
            <option [ngValue]="1">Haute</option>
            <option [ngValue]="2">Moyenne</option>
            <option [ngValue]="3">Basse</option>
          </select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Échéance</mat-label>
          <input matInput [matDatepicker]="picker" name="dateLimite" [(ngModel)]="dateLimite">
          <mat-hint>JJ/MM/AAAA</mat-hint>
          <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
          @if (erreurs()['dateLimite']) {
            <small class="erreur">{{ erreurs()['dateLimite'] }}</small>
          }
        </mat-form-field>

      </div>

      <div class="actions">
        <a routerLink="/taches" class="bouton-annuler">Annuler</a>
        <button type="button" class="bouton-valider" (click)="ajouterTache()">Enregistrer</button>
      </div>

    </form>
  </div>

</main>
