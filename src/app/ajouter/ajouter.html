<div>AJOUTER TACHE</div>
<form>
<!-- #ajouter tache -->
<mat-form-field >
<mat-label> Titre Tâche </mat-label>
<!--  <input matInput placeholder="Taches" value="" [(ngModel)]="titre">    --> 
<!--le champs va etre null , il faut rajouter un attribut name  car on dans Form pour que  le ngModel can work this Mf -_- same thing pour les autres  -->
<input matInput placeholder="Taches" name="titre" [(ngModel)]="titre">

</mat-form-field> 


<mat-form-field>
  <mat-label>Date limite</mat-label>
<!-- #date limite de la tache -->
  <input matInput [matDatepicker]="picker" name="dateLimite" [(ngModel)]="dateLimite">
  <mat-hint>JJ/MM/AAAA</mat-hint>
  <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
  <mat-datepicker #picker></mat-datepicker>
  
<!-- #enddocregion toggle -->
</mat-form-field>

<mat-form-field>
<mat-label>Priorité :</mat-label>
<select matNativeControl name="priorite" [(ngModel)]="priorite" required>
  <option >1</option>
  <option >2</option>
  <option >3</option>
 
</select>
</mat-form-field>

<div>
<button (click)="ajouterTache()">Valider</button>



</div>

</form>
