<div class="login-container">
  <h2>Connexion</h2>

<section>
  <div class="example-label">Outlined</div>
  <div class="example-button-row">
  
    <a matButton="outlined" href="http://localhost:4200/register/" target="_blank">Inscription1</a>
<button mat-raised-button routerLink="/register">Inscription2</button>
  </div>
</section>


  <!-- <button mat-button routerLink="/ajouter"> S'inscrire</button>    -->
  <form (ngSubmit)="onLogin()">
    <div>
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" required />
    </div>
    <div>
      <label>Mot de passe</label>
      <input type="password" [(ngModel)]="password" name="password" required />
    </div>
    <button type="submit">Se connecter</button>
    
  </form>
  <p *ngIf="erreur" style="color:red">{{ erreur }}</p>
