<div class="register-container">
  <h2>Inscription</h2>

  <form (ngSubmit)="register()" class="register-form">
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" [(ngModel)]="email" name="email" required />
    </mat-form-field>
    <div class="error-zone">
      @if (erreurs()['email']) {
        <small class="error-text">{{ erreurs()['email'] }}</small>
      }
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Mot de passe</mat-label>
      <input matInput
             [type]="hidePassword() ? 'password' : 'text'"
             [(ngModel)]="password"
             name="password"
             required />
      <button mat-icon-button matSuffix type="button"
              (click)="togglePassword($event)"
              aria-label="Afficher ou masquer le mot de passe"
              [attr.aria-pressed]="!hidePassword()">
        <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>
    <div class="error-zone">
      @if (erreurs()['password']) {
        <small class="error-text">{{ erreurs()['password'] }}</small>
      }
    </div>

    <div class="error-zone">
      @if (erreurs()['message']) {
        <small class="error-text">{{ erreurs()['message'] }}</small>
      }
    </div>

    <button mat-flat-button type="submit" class="full-width">S'inscrire</button>
  </form>

  <p class="login-link">Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
</div>
